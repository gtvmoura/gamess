name: Buscar assets grátis (Kenney, CC0)

# Clona os Starter Kits públicos da Kenney no GitHub (assets CC0) e publica
# a lista de arquivos, os sons e os modelos na branch "assets-raw" para escolha.

on:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-assets.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar starter kits da Kenney
        run: |
          mkdir -p out src
          for repo in Starter-Kit-City-Builder Starter-Kit-Racing Starter-Kit-3D-Platformer Starter-Kit-FPS Starter-Kit-Basic-Scene; do
            if git clone -q --depth 1 "https://github.com/KenneyNL/$repo" "src/$repo"; then
              echo "ok $repo"
              (cd "src/$repo" && find . -type f -not -path './.git/*' | sort) > "out/$repo.files.txt"
              cp "src/$repo"/LICENSE* "out/$repo.LICENSE.txt" 2>/dev/null || true
              cp "src/$repo"/README* "out/$repo.README.md" 2>/dev/null || true
              mkdir -p "out/$repo"
              # modelos, sons, texturas e imagens (sem .import / cenas)
              (cd "src/$repo" && find . -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.bin' -o -iname '*.ogg' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.png' -o -iname '*.ttf' \) -not -path './.git/*' -size -8M -exec cp --parents {} "../../out/$repo/" \;)
            else
              echo "falhou $repo"
            fi
          done
          du -sh out/*
      - name: Publicar na branch "assets-raw"
        run: |
          cd out
          git init -q -b assets-raw
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Assets dos Starter Kits da Kenney (CC0) para escolha"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" assets-raw
