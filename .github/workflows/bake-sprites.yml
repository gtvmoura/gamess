name: Estacionamento Tycoon - Assar sprites dos modelos 3D

on:
  push:
    branches: [main]
    paths: ["estacionamento-tycoon/tools/**", "estacionamento-tycoon/assets/kenney/**", ".github/workflows/bake-sprites.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot e tela virtual
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa > /dev/null
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v4.3-stable_linux.x86_64 godot && rm godot.zip
      - name: Importar projeto
        run: timeout 300 ./godot --headless --import --path estacionamento-tycoon || true
      - name: Renderizar sprites
        run: |
          mkdir -p sprites
          timeout 600 xvfb-run -a -s "-screen 0 1280x1400x24" ./godot --path estacionamento-tycoon \
            --rendering-driver opengl3 --rendering-method gl_compatibility --audio-driver Dummy \
            -s res://tools/bake_sprites.gd -- --out="$PWD/sprites" 2>&1 | tee bake.log
          ls -la sprites
          test -f sprites/sprites.json
      - name: Publicar na branch "sprites"
        run: |
          cp bake.log sprites/
          cd sprites
          git init -q -b sprites
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Sprites assados do commit ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sprites
