name: Estacionamento Tycoon - Testes e APK Android

on:
  push:
    paths: ["estacionamento-tycoon/**", ".github/workflows/estacionamento-tycoon.yml"]
  pull_request:
    paths: ["estacionamento-tycoon/**", ".github/workflows/estacionamento-tycoon.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Importar projeto
        run: timeout 300 godot --headless --import --path estacionamento-tycoon || true
      - name: Testes de economia
        run: timeout 120 godot --headless --path estacionamento-tycoon --script res://tests/run_tests.gd
      - name: Rodar o jogo (simula 30 segundos)
        run: |
          timeout 300 godot --headless --path estacionamento-tycoon --fixed-fps 60 --quit-after 1800 2>&1 | tee run.log
          if grep -nE "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Invalid get|Invalid set" run.log; then
            echo "Erros encontrados ao rodar o jogo"; exit 1
          fi

  android:
    needs: testes
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Godot e keystore de debug
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          if [ -d /root/.config/godot ] && [ "$HOME" != "/root" ]; then cp -r /root/.config/godot ~/.config/godot; fi
          if [ "$HOME" != "/root" ]; then cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/; fi
          if [ ! -f /root/debug.keystore ]; then
            keytool -genkeypair -keyalg RSA -alias androiddebugkey -keypass android -storepass android \
              -keystore /root/debug.keystore -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi
      - name: Importar projeto
        run: timeout 300 godot --headless --import --path estacionamento-tycoon || true
      - name: Exportar APK
        run: |
          mkdir -p build/android
          OUT="$(pwd)/build/android/estacionamento-tycoon.apk"
          godot --headless --path estacionamento-tycoon --export-debug "Android" "$OUT"
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: estacionamento-tycoon-apk
          path: build/android/estacionamento-tycoon.apk
      - name: Publicar APK na release "estacionamento-tycoon-latest"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: estacionamento-tycoon-latest
          name: Estacionamento Tycoon (versão mais recente)
          body: |
            APK de teste gerado automaticamente a partir do commit ${{ github.sha }}.
            Baixe o arquivo .apk abaixo no celular e instale (permita "fontes desconhecidas").
          make_latest: true
          files: build/android/estacionamento-tycoon.apk
      - name: Publicar APK na branch "apk"
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          mkdir apk-branch && cp build/android/estacionamento-tycoon.apk apk-branch/
          cd apk-branch
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "APK do commit ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
